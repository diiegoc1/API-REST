services:
  api:
    image: ghcr.io/diiegoc1/api-rest:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://turnos:${POSTGRES_PASSWORD}@db:5432/turnos
    restart: unless-stopped
    volumes:
      - datos:/app/datos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/servicios"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: turnos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_datos:/data
    depends_on:
      - api

volumes:
  datos:
  pgdata:
  caddy_datos: